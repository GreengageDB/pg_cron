name: Check

on:
  pull_request:
    paths-ignore:
      - "*.md"

# Concurrency control to cancel previous runs on new push to same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Automatically cancel any previous runs for the same group

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ggdb7_ubuntu]
    container:
      image: ghcr.io/greengagedb/greengage/${{ matrix.image }}:latest
      options:
        --sysctl "kernel.sem=500 1024000 200 4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and install
        run: $GITHUB_WORKSPACE/ci/install.bash
        working-directory: /home/gpadmin
      - name: Tests
        run: su gpadmin -c '$GITHUB_WORKSPACE/ci/test.bash'
      - name: Collect logs
        uses: greengagedb/greengage-ci/.github/actions/collect-logs@v55
        with:
          params: |
            gpAdminLogs d gpAdminLogs
            gpdb_src/gpAux/gpdemo/datadirs d *log
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg_cron_${{ matrix.image }}_logs
          path: /logs
